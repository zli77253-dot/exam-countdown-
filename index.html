<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>考试倒计时</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e8edf3;--blue:#4169e1;--blue2:#edf2ff;--red:#d9485f;--shadow:0 8px 30px rgba(24,34,48,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}button{border:0;border-radius:12px;padding:11px 15px;font-weight:650;font-size:14px;cursor:pointer}.primary{background:var(--blue);color:white}.soft{background:var(--blue2);color:var(--blue)}.danger{background:#fff0f1;color:var(--red)}.ghost{background:#f2f4f7;color:#344054}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:5px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.month{font-weight:750;font-size:18px}.nav{display:flex;gap:6px}.nav button{padding:8px 11px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{color:var(--muted);font-size:12px;margin-bottom:8px}.day{min-height:62px;border-radius:12px;padding:7px 2px;font-size:13px;position:relative;background:#fafbfc;border:1px solid transparent}.day.muted{color:#b6bdc8;background:transparent}.day.today{border-color:var(--blue);background:var(--blue2);font-weight:750}.day.selected{background:#dfe7ff;border-color:var(--blue)}.dot{width:5px;height:5px;background:var(--red);border-radius:50%;display:block;margin:5px auto 0}.list{display:flex;flex-direction:column;gap:10px}.exam{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.exam h3{font-size:15px;margin:0 0 5px}.exam p{font-size:12px;color:var(--muted);margin:0 0 3px}.left{min-width:0}.count{font-size:18px;font-weight:800;white-space:nowrap}.count.past{color:var(--muted);font-size:13px}.count.soon{color:var(--red)}.actions{display:flex;gap:6px;margin-top:9px}.actions button{padding:6px 9px;font-size:12px}.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px}form{display:grid;gap:12px}label{font-size:13px;color:#475467;font-weight:650}input,textarea{width:100%;margin-top:6px;border:1px solid #d0d5dd;border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:65px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formactions{display:flex;gap:8px}.notice{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.day{min-height:54px}.wrap{padding-top:18px}h1{font-size:22px}}
</style></head><body><div class="wrap">
<header class="top"><div><h1>📚 考试倒计时</h1><div class="sub" id="todayText">把每一次考试，都安排得明明白白。</div></div><button class="primary" id="addTop">＋ 添加考试</button></header>
<section class="stats"><div class="stat"><small>待参加考试</small><strong id="upcoming">0</strong></div><div class="stat"><small>最近一场考试</small><strong id="nearest">—</strong></div><div class="stat"><small>本月考试</small><strong id="thisMonth">0</strong></div></section>
<div class="layout"><section class="panel"><div class="panelhead"><div class="month" id="monthLabel"></div><div class="nav"><button class="ghost" id="prev">‹</button><button class="ghost" id="next">›</button></div></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days" id="days"></div><div class="notice">点击日期查看当天考试。红点表示当天有考试。</div></section>
<section class="panel"><div class="panelhead"><strong id="listTitle">接下来的考试</strong><button class="soft" id="clearFilter">查看全部</button></div><div class="list" id="examList"></div></section></div>
<section class="panel" id="editor" style="margin-top:16px;display:none"><div class="panelhead"><strong id="formTitle">添加考试</strong><button class="ghost" id="closeForm">关闭</button></div><form id="examForm"><input type="hidden" id="editId"><label>考试名称<input id="name" required maxlength="60" placeholder="例如：大学英语六级"></label><div class="formrow"><label>考试日期<input id="date" type="date" required></label><label>考试时间（可选）<input id="time" type="time"></label></div><label>考试地点（可选）<input id="place" maxlength="80" placeholder="例如：教学楼 203"></label><label>备注（可选）<textarea id="note" maxlength="300" placeholder="复习重点、携带物品等"></textarea></label><div class="formactions"><button class="primary" type="submit">保存考试</button><button class="ghost" type="button" id="cancel">取消</button></div></form></section>
<p class="notice">数据保存在当前浏览器本地。清理浏览器数据或更换设备前请先备份；此版本不会自动跨设备同步。</p></div>
<script>
const $=id=>document.getElementById(id),today=new Date();today.setHours(0,0,0,0);const key='examCountdownItemsV1';let exams=load(),view=new Date(today.getFullYear(),today.getMonth(),1),selected=null;
function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function save(){localStorage.setItem(key,JSON.stringify(exams))}function dateObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function dayDiff(s){return Math.round((dateObj(s)-today)/86400000)}function fmt(s){return s.replaceAll('-','/')}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('todayText').textContent='今天是 '+today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';const f=exams.filter(e=>dayDiff(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));$('upcoming').textContent=f.length;$('nearest').textContent=f.length?(dayDiff(f[0].date)===0?'今天':dayDiff(f[0].date)+'天'):'—';$('thisMonth').textContent=exams.filter(e=>{let d=dateObj(e.date);return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()}).length;calendar();list()}
function calendar(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pn=new Date(y,m,0).getDate();$('monthLabel').textContent=y+'年'+(m+1)+'月';let out='';for(let i=0;i<42;i++){let d=i-first+1,dt,muted=false;if(d<1){dt=new Date(y,m-1,pn+d);muted=true}else if(d>n){dt=new Date(y,m+1,d-n);muted=true}else dt=new Date(y,m,d);let iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),has=exams.some(e=>e.date===iso);out+=`<button class="day ${muted?'muted':''} ${dt.getTime()===today.getTime()?'today':''} ${selected===iso?'selected':''}" data-date="${iso}">${dt.getDate()}${has?'<span class="dot"></span>':''}</button>`}$('days').innerHTML=out;$('days').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;calendar();list()})}
function list(){let a=[...exams].sort((x,y)=>x.date.localeCompare(y.date));if(selected){a=a.filter(e=>e.date===selected);$('listTitle').textContent=fmt(selected)+' 的考试'}else{$('listTitle').textContent='接下来的考试';a=a.filter(e=>dayDiff(e.date)>=0)}$('examList').innerHTML=a.length?a.map(e=>{let n=dayDiff(e.date),t=n<0?'已结束':n===0?'今天考试':'还有 '+n+' 天';return `<article class="exam"><div class="left"><h3>${esc(e.name)}</h3><p>${fmt(e.date)}${e.time?' · '+e.time:''}${e.place?' · '+esc(e.place):''}</p>${e.note?'<p>'+esc(e.note)+'</p>':''}<div class="actions"><button class="soft" data-edit="${e.id}">编辑</button><button class="danger" data-del="${e.id}">删除</button></div></div><div class="count ${n<0?'past':n<=3?'soon':''}">${t}</div></article>`}).join(''):'<div class="empty">'+(selected?'这一天没有安排考试。':'还没有待参加的考试，点击右上角添加吧。')+'</div>';$('examList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('examList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}
function open(){ $('editor').style.display='block';$('editor').scrollIntoView({behavior:'smooth'})}function reset(){ $('examForm').reset();$('editId').value='';$('formTitle').textContent='添加考试'}function edit(id){let e=exams.find(x=>x.id===id);if(!e)return;$('editId').value=id;$('name').value=e.name;$('date').value=e.date;$('time').value=e.time||'';$('place').value=e.place||'';$('note').value=e.note||'';$('formTitle').textContent='编辑考试';open()}function del(id){if(confirm('确定删除这场考试吗？')){exams=exams.filter(e=>e.id!==id);save();render()}}
$('addTop').onclick=()=>{reset();open()};$('closeForm').onclick=$('cancel').onclick=()=>{$('editor').style.display='none';reset()};$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);calendar()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);calendar()};$('clearFilter').onclick=()=>{selected=null;calendar();list()};$('examForm').onsubmit=e=>{e.preventDefault();let id=$('editId').value||String(Date.now()),item={id,name:$('name').value.trim(),date:$('date').value,time:$('time').value,place:$('place').value.trim(),note:$('note').value.trim()},i=exams.findIndex(x=>x.id===id);if(i>=0)exams[i]=item;else exams.push(item);save();selected=null;view=new Date(dateObj(item.date).getFullYear(),dateObj(item.date).getMonth(),1);$('editor').style.display='none';reset();render()};render();
</script></body></html>
